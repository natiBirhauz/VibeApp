name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name'
        required: true
        default: 'VibeApp'
      app_code:
        description: 'Base64 encoded App.tsx content'
        required: true
      app_icon_url:
        description: 'App icon URL (optional)'
        required: false
        default: ''
      project_id:
        description: 'Supabase project ID for upload path'
        required: true
      supabase_url:
        description: 'Supabase project URL'
        required: true
      supabase_key:
        description: 'Supabase service role key'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout the repo (contains the Expo shell project)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: templates/expo-base/package.json

      # 3. Setup Java 17 (required for Gradle/Android)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Install Expo + EAS CLI
      - name: Install Expo CLI
        run: npm install -g expo-cli@latest eas-cli@latest

      # 6. Prepare Expo project from template
      - name: Prepare Expo project
        run: |
          cp -r templates/expo-base /tmp/expo-app
          cd /tmp/expo-app
          npm install

      # 7. Decode App.tsx from base64
      - name: Inject App.tsx
        run: |
          echo "${{ github.event.inputs.app_code }}" | base64 --decode > /tmp/expo-app/App.tsx
          echo "App.tsx injected successfully"

      # 8. Update app.json with dynamic values
      - name: Update app.json
        run: |
          cd /tmp/expo-app
          APP_SLUG=$(echo "${{ github.event.inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          PACKAGE_NAME="com.vibeapp.$(echo '${{ github.event.inputs.project_id }}' | tr -d '-' | cut -c1-20)"
          cat > app.json << EOF
          {
            "expo": {
              "name": "${{ github.event.inputs.app_name }}",
              "slug": "${APP_SLUG}",
              "version": "1.0.0",
              "orientation": "portrait",
              "userInterfaceStyle": "automatic",
              "android": {
                "adaptiveIcon": {
                  "backgroundColor": "#7c3aed"
                },
                "package": "${PACKAGE_NAME}"
              },
              "scheme": "vibeapp"
            }
          }
          EOF

      # 9. Expo prebuild (generates android/ directory)
      - name: Expo prebuild
        run: |
          cd /tmp/expo-app
          npx expo prebuild --platform android --clean --no-install

      # 10. Build APK with Gradle
      - name: Build APK
        run: |
          cd /tmp/expo-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 11. Sign APK
      - name: Sign APK
        run: |
          # Decode keystore from GitHub Secrets
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/vibeapp.keystore

          # Find the unsigned APK
          APK_PATH=$(find /tmp/expo-app/android -name "*release*unsigned*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find /tmp/expo-app/android -name "*release*.apk" 2>/dev/null | head -1)
          fi

          echo "Signing: $APK_PATH"

          # Sign with zipalign + apksigner
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$APK_PATH" /tmp/app-aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/vibeapp.keystore \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out /tmp/app-signed.apk \
            /tmp/app-aligned.apk

          echo "APK signed successfully"

      # 12. Upload signed APK to Supabase Storage
      - name: Upload APK to Supabase Storage
        run: |
          PROJECT_ID="${{ github.event.inputs.project_id }}"
          SUPABASE_URL="${{ github.event.inputs.supabase_url }}"
          SUPABASE_KEY="${{ github.event.inputs.supabase_key }}"

          curl -X POST \
            "${SUPABASE_URL}/storage/v1/object/apks/${PROJECT_ID}.apk" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary @/tmp/app-signed.apk

          echo "APK uploaded to: ${SUPABASE_URL}/storage/v1/object/public/apks/${PROJECT_ID}.apk"

      # 13. Summary
      - name: Build summary
        run: |
          echo "## ✅ APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** ${{ github.event.inputs.app_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project ID:** ${{ github.event.inputs.project_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK URL:** ${{ github.event.inputs.supabase_url }}/storage/v1/object/public/apks/${{ github.event.inputs.project_id }}.apk" >> $GITHUB_STEP_SUMMARY
